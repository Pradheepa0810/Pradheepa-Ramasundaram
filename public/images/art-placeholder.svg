<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none">
  <rect width="700" height="500" fill="#FDE8EC" rx="28"/>
  <circle cx="580" cy="380" r="100" fill="#E85D75" fill-opacity="0.25"/>
  <circle cx="120" cy="110" r="80" fill="#1E4ED8" fill-opacity="0.15"/>

  <!-- Painting Palette & Expressive Swatches -->
  <g transform="translate(190, 70)">
    <!-- Wooden / Ceramic Artist Palette -->
    <path d="M70 200 C30 140, 60 40, 170 30 C270 20, 310 90, 300 160 C290 220, 260 250, 200 250 C170 250, 160 220, 130 220 C100 220, 90 240, 70 200 Z" fill="#FFFFFF" stroke="#1E1A17" stroke-width="4" filter="drop-shadow(6px 6px 0px #1E1A17)"/>
    
    <!-- Thumb hole -->
    <ellipse cx="230" cy="190" rx="18" ry="24" fill="#FDE8EC" stroke="#1E1A17" stroke-width="3"/>

    <!-- Paint dabs -->
    <circle cx="100" cy="110" r="16" fill="#1E4ED8"/>
    <circle cx="150" cy="70" r="16" fill="#F26419"/>
    <circle cx="210" cy="65" r="16" fill="#F6AE2D"/>
    <circle cx="265" cy="100" r="16" fill="#496E4C"/>
    <circle cx="270" cy="150" r="16" fill="#E85D75"/>

    <!-- Paintbrush -->
    <g transform="translate(140, 90) rotate(45)">
      <!-- Handle -->
      <path d="M0 0 L15 0 L10 160 L5 160 Z" fill="#F26419" stroke="#1E1A17" stroke-width="3"/>
      <!-- Ferrule -->
      <rect x="1" y="-20" width="13" height="20" fill="#DDD6FE" stroke="#1E1A17" stroke-width="3"/>
      <!-- Bristles -->
      <path d="M1 -20 Q7.5 -48 14 -20 Z" fill="#E85D75" stroke="#1E1A17" stroke-width="3"/>
    </g>

    <!-- Expressive Brush Strokes in Background -->
    <path d="M-60 160 C-20 180, 20 150, 60 170" stroke="#1E4ED8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M260 20 C290 40, 320 20, 350 40" stroke="#F6AE2D" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Placeholder Banner -->
  <g transform="translate(160, 400)">
    <rect width="380" height="64" rx="14" fill="#FFFFFF" stroke="#1E1A17" stroke-width="3" filter="drop-shadow(4px 4px 0px #1E1A17)"/>
    <text x="190" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#1E1A17" text-anchor="middle">ART PHOTO PLACEHOLDER</text>
    <text x="190" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#6B7280" text-anchor="middle">Suggested: Canvas in progress, sketchbook, or finished piece</text>
  </g>
</svg>
