<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none">
  <rect width="700" height="500" fill="#EDF4EE" rx="28"/>
  <circle cx="580" cy="110" r="90" fill="#E85D75" fill-opacity="0.2"/>
  <circle cx="110" cy="390" r="85" fill="#496E4C" fill-opacity="0.2"/>

  <!-- Embroidery Hoop with Botanical Floral Stitches -->
  <g transform="translate(230, 60)">
    <!-- Outer wooden hoop -->
    <circle cx="120" cy="150" r="130" stroke="#F26419" stroke-width="12" fill="#FAF7F0" filter="drop-shadow(6px 6px 0px #1E1A17)"/>
    <circle cx="120" cy="150" r="124" stroke="#1E1A17" stroke-width="3" fill="none"/>
    <circle cx="120" cy="150" r="136" stroke="#1E1A17" stroke-width="3" fill="none"/>

    <!-- Brass Screw Clamp at top -->
    <rect x="105" y="6" width="30" height="16" rx="4" fill="#F6AE2D" stroke="#1E1A17" stroke-width="3"/>
    <rect x="115" y="-4" width="10" height="12" rx="2" fill="#F6AE2D" stroke="#1E1A17" stroke-width="2"/>

    <!-- Stitched botanical floral motif -->
    <!-- Stems -->
    <path d="M120 220 Q100 160, 120 100" stroke="#496E4C" stroke-width="4" stroke-dasharray="4 3" stroke-linecap="round" fill="none"/>
    <path d="M110 170 Q80 150, 75 130" stroke="#496E4C" stroke-width="3" stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>
    <path d="M118 140 Q150 130, 165 110" stroke="#496E4C" stroke-width="3" stroke-dasharray="3 3" stroke-linecap="round" fill="none"/>
    
    <!-- Leaves -->
    <ellipse cx="75" cy="125" rx="10" ry="16" fill="#496E4C" transform="rotate(-30 75 125)"/>
    <ellipse cx="165" cy="105" rx="10" ry="16" fill="#496E4C" transform="rotate(35 165 105)"/>

    <!-- French Knots & Blossom Petals -->
    <circle cx="120" cy="95" r="16" fill="#E85D75"/>
    <circle cx="108" cy="85" r="10" fill="#F6AE2D"/>
    <circle cx="132" cy="85" r="10" fill="#F6AE2D"/>
    <circle cx="120" cy="72" r="10" fill="#F6AE2D"/>

    <!-- Embroidery needle -->
    <g transform="translate(180, 180) rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="80" stroke="#1E1A17" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="0" cy="10" rx="1" ry="4" fill="#FAF7F0"/>
      <!-- Thread in eye -->
      <path d="M0 10 Q20 30, 10 60" stroke="#E85D75" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Placeholder Banner -->
  <g transform="translate(160, 400)">
    <rect width="380" height="64" rx="14" fill="#FFFFFF" stroke="#1E1A17" stroke-width="3" filter="drop-shadow(4px 4px 0px #1E1A17)"/>
    <text x="190" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#1E1A17" text-anchor="middle">EMBROIDERY PHOTO PLACEHOLDER</text>
    <text x="190" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#6B7280" text-anchor="middle">Suggested: Stitched hoop art, denim detail, or botanical pattern</text>
  </g>
</svg>
