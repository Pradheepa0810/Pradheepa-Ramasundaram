<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none">
  <rect width="700" height="500" fill="#FEEDE4" rx="28"/>
  <circle cx="590" cy="120" r="90" fill="#DDD6FE" fill-opacity="0.8"/>
  <circle cx="100" cy="400" r="80" fill="#F26419" fill-opacity="0.2"/>

  <!-- Granny Square & Yarn Skein Elements -->
  <g transform="translate(180, 70)">
    <!-- Granny Square motif -->
    <rect x="20" y="40" width="160" height="160" rx="16" fill="#FFFFFF" stroke="#1E1A17" stroke-width="4" filter="drop-shadow(6px 6px 0px #1E1A17)"/>
    <!-- Nested colored squares -->
    <rect x="45" y="65" width="110" height="110" rx="10" fill="#DDD6FE" stroke="#1E1A17" stroke-width="3"/>
    <rect x="70" y="90" width="60" height="60" rx="6" fill="#F26419" stroke="#1E1A17" stroke-width="3"/>
    <circle cx="100" cy="120" r="14" fill="#F6AE2D" stroke="#1E1A17" stroke-width="3"/>
    
    <!-- Yarn Ball -->
    <g transform="translate(210, 80)">
      <circle cx="60" cy="60" r="56" fill="#E85D75" stroke="#1E1A17" stroke-width="4"/>
      <!-- Yarn winding curves -->
      <path d="M25 35 C50 15, 80 25, 95 50" stroke="#FAF7F0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M15 65 C40 45, 80 50, 105 75" stroke="#FAF7F0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M30 90 C55 75, 85 85, 95 105" stroke="#FAF7F0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Trailing thread -->
      <path d="M100 100 C130 140, 90 190, 150 200" stroke="#E85D75" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Crochet Hook -->
    <g transform="translate(50, 20) rotate(-35)">
      <rect x="0" y="0" width="12" height="150" rx="6" fill="#1E4ED8" stroke="#1E1A17" stroke-width="3"/>
      <!-- Hook tip -->
      <path d="M0 10 Q-8 5, -2 -6 Q4 -10, 12 -2" fill="#1E4ED8" stroke="#1E1A17" stroke-width="3"/>
    </g>
  </g>

  <!-- Placeholder Banner -->
  <g transform="translate(160, 400)">
    <rect width="380" height="64" rx="14" fill="#FFFFFF" stroke="#1E1A17" stroke-width="3" filter="drop-shadow(4px 4px 0px #1E1A17)"/>
    <text x="190" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#1E1A17" text-anchor="middle">CROCHET PHOTO PLACEHOLDER</text>
    <text x="190" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#6B7280" text-anchor="middle">Suggested: Cozy wearables, amigurumi, or textured blanket</text>
  </g>
</svg>
