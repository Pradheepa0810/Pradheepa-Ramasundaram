<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#FAF7F0"/>
  <!-- Decorative Background Blocks -->
  <circle cx="1100" cy="100" r="220" fill="#EBF1FF"/>
  <circle cx="100" cy="550" r="180" fill="#FEEDE4"/>
  <rect x="950" y="380" width="200" height="200" rx="40" fill="#FDE8EC" transform="rotate(15 950 380)"/>

  <!-- Card Frame -->
  <g transform="translate(100, 80)">
    <rect width="1000" height="470" rx="36" fill="#FFFFFF" stroke="#1E1A17" stroke-width="5" filter="drop-shadow(12px 12px 0px #1E1A17)"/>

    <!-- Top Bar Badge -->
    <rect x="50" y="45" width="270" height="40" rx="20" fill="#1E4ED8"/>
    <text x="185" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CREATIVE &amp; SPIRITUAL</text>

    <!-- Main Title -->
    <text x="50" y="160" font-family="'Fraunces', Georgia, serif" font-weight="800" font-size="56" fill="#1E1A17">A slow romance</text>
    <text x="50" y="225" font-family="'Fraunces', Georgia, serif" font-weight="800" font-size="56" fill="#E85D75">with my own life.</text>

    <!-- Tagline (wrapped to two lines to fit the card) -->
    <text x="50" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#4B5563">The corner of the internet where I keep my paintbrushes and palette,</text>
    <text x="50" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="20" fill="#4B5563">my yoga mat, my tarot deck, my sourdough starter, and my sewing basket.</text>

    <!-- Interest Pills: Row 1 -->
    <g transform="translate(50, 335)">
      <rect x="0" y="0" width="110" height="42" rx="21" fill="#EDF4EE" stroke="#1E1A17" stroke-width="2"/>
      <text x="55" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#496E4C" text-anchor="middle">🧘 Yoga</text>

      <rect x="125" y="0" width="110" height="42" rx="21" fill="#EBF1FF" stroke="#1E1A17" stroke-width="2"/>
      <text x="180" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#1E4ED8" text-anchor="middle">🔮 Tarot</text>

      <rect x="250" y="0" width="120" height="42" rx="21" fill="#FEEDE4" stroke="#1E1A17" stroke-width="2"/>
      <text x="310" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#F26419" text-anchor="middle">🍞 Baking</text>

      <rect x="385" y="0" width="100" height="42" rx="21" fill="#FDE8EC" stroke="#1E1A17" stroke-width="2"/>
      <text x="435" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#E85D75" text-anchor="middle">🎨 Art</text>
    </g>

    <!-- Interest Pills: Row 2 -->
    <g transform="translate(50, 390)">
      <rect x="0" y="0" width="120" height="42" rx="21" fill="#EDEAFE" stroke="#1E1A17" stroke-width="2"/>
      <text x="60" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#1E1A17" text-anchor="middle">🧶 Crochet</text>

      <rect x="135" y="0" width="140" height="42" rx="21" fill="#EDF4EE" stroke="#1E1A17" stroke-width="2"/>
      <text x="205" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#496E4C" text-anchor="middle">🪡 Embroidery</text>

      <rect x="290" y="0" width="110" height="42" rx="21" fill="#F2EADB" stroke="#1E1A17" stroke-width="2"/>
      <text x="345" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#6E5035" text-anchor="middle">📚 Books</text>
    </g>
  </g>
</svg>
