<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1365" viewBox="0 0 768 1365">
  <defs>
    <filter id="folds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .004" numOctaves="3" seed="16"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".42" intercept=".58"/>
        <feFuncG type="linear" slope=".38" intercept=".24"/>
        <feFuncB type="linear" slope=".4" intercept=".39"/>
      </feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
    </filter>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1h6M1 0v6" stroke="#ffe3eb" stroke-opacity=".1"/>
      <path d="M0 4h6M4 0v6" stroke="#8e385b" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="768" height="1365" fill="#e582a8"/>
  <rect width="768" height="1365" filter="url(#folds)"/>
  <rect width="768" height="1365" fill="url(#weave)"/>
  <rect width="768" height="1365" filter="url(#grain)" opacity=".65"/>
</svg>